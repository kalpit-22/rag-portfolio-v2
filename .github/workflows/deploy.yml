name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portfolio-agent:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/portfolio-agent:latest
            
            # Stop and remove the old container if it exists
            docker stop portfolio-agent || true
            docker rm portfolio-agent || true
            
            # Note: We rely on the .env file being present on the EC2 server at ~/rag-portfolio-v2/.env
            # Run the new container
            docker run -d \
              -p 80:8000 \
              --env-file ~/rag-portfolio-v2/.env \
              --name portfolio-agent \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/portfolio-agent:latest
            
            # Clean up old dangling images to save space
            docker image prune -f
